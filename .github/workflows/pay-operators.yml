name: Pay operators
# Every Monday the API pays each connected operator what is due: the bookings whose trip day has passed,
# on that operator's weekly or two-weekly pay day. The run is idempotent (one transfer per booking code), so a
# rerun or a manual dispatch cannot pay anyone twice. Needs the OUTSET_ADMIN_KEY secret, the same value as
# ADMIN_KEY on the outset-api service on Render.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          if [ -z "${{ secrets.OUTSET_ADMIN_KEY }}" ]; then echo "OUTSET_ADMIN_KEY secret is not set; nothing paid"; exit 1; fi
          curl -fsS -m 300 -X POST -H "x-admin-key: ${{ secrets.OUTSET_ADMIN_KEY }}" https://outset-api.onrender.com/admin/payouts/run

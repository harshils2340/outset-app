name: Keep the API awake
# Render's free tier sleeps the API after 15 idle minutes and the next request waits out a cold start.
# A ping every 12 minutes keeps "Book and pay" from being the request that pays for it.
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 -o /dev/null -w "API answered in %{time_total}s\n" https://outset-api.onrender.com/health

name: Photo screen
# Judges every published photo from its pixels and removes scanned booklets, price lists, logos and maps.
# Runs in the cloud, never on a laptop. Safe to run any time: it only rewrites public/ and skips images it
# has already judged.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Images to judge this run
        default: "20000"
concurrency:
  group: photo-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npx tsx scripts/screen-published.mts --limit=${{ github.event.inputs.limit || 20000 }} --concurrency=12
        working-directory: backend
      - name: Commit what changed
        run: |
          git config user.name "Outset photo screen"
          git config user.email "noreply@onoutset.com"
          git add public/photo-verdicts.json public/o public/catalog.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Photo screen: booklet pages, price lists and logos removed from published listings"
          git pull --rebase origin main
          git push origin main

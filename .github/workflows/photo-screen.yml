name: Photo screen
# Judges every published photo from its pixels and removes scanned booklets, price lists, logos and maps.
# Runs in the cloud, never on a laptop. Safe to run any time: it only rewrites public/ and skips images it
# has already judged.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: Parallel image fetches
        default: "16"
concurrency:
  group: photo-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      # sharp decodes and shrinks images on the runner so the screen can fetch from each host directly instead
      # of through the image proxy, which throttles GitHub's shared addresses. Not added to package.json.
      - run: npm i --no-save sharp@0.34.3
        working-directory: backend
      - run: npx tsx scripts/screen-published.mts --minutes=38 --concurrency=${{ github.event.inputs.concurrency || 16 }}
        working-directory: backend
      # Syncs push new public/o files while the screen runs, so a rebase of rewritten listings conflicts and the
      # run's verdicts were being thrown away. The verdicts are the work; the rewrite is cheap. So keep the
      # verdicts, start again from the newest main, merge them into its cache, re-apply them (judging nothing),
      # and push. Retries if another push lands in between.
      - name: Commit what changed
        run: |
          git config user.name "Outset photo screen"
          git config user.email "noreply@onoutset.com"
          cp backend/data/photo-verdicts.json "$RUNNER_TEMP/verdicts.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            node -e '
              const fs = require("fs");
              const p = "backend/data/photo-verdicts.json";
              let base = {};
              try { base = JSON.parse(fs.readFileSync(p, "utf8")); } catch {}
              const mine = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/verdicts.json", "utf8"));
              for (const [k, v] of Object.entries(mine)) if (!base[k] || (base[k].kind || base[k]) === "unknown") base[k] = v;
              fs.writeFileSync(p, JSON.stringify(base));
            '
            (cd backend && npx tsx scripts/screen-published.mts --minutes=0)
            git add backend/data/photo-verdicts.json public/o public/catalog.json
            git diff --cached --quiet && echo "nothing to commit" && exit 0
            git commit -q -m "Photo screen: booklet pages, price lists and logos removed from published listings"
            git push -q origin main && exit 0
            sleep $((attempt * 10))
          done
          exit 1

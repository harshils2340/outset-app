<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsubscribe · Outset</title>
  <style>
    body { font-family: Inter, system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1.25rem; color: #111; line-height: 1.5; }
    a { color: #E54D2C; }
  </style>
</head>
<body>
  <p id="msg">Taking you off the list…</p>
  <p><a href="https://onoutset.com/">Outset</a></p>
  <script>
    const API = "https://outset-api.onrender.com";
    const t = new URLSearchParams(location.search).get("t") || "";
    const msg = document.getElementById("msg");
    if (!t) {
      msg.textContent = "That unsubscribe link is missing. Write to hello@onoutset.com and we will take you off the list.";
    } else {
      fetch(API + "/unsubscribe?t=" + encodeURIComponent(t), { method: "POST" })
        .then((r) => {
          msg.textContent = r.ok
            ? "You are unsubscribed. We will not email this address again."
            : "That link is not valid. Write to hello@onoutset.com and we will take you off the list.";
        })
        .catch(() => {
          msg.textContent = "We could not reach the server. Write to hello@onoutset.com with the word unsubscribe and we will take you off the list.";
        });
    }
  </script>
</body>
</html>

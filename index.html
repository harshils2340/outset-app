<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The site is static on GitHub Pages, so this meta tag is the only place a policy can live: no server to
      send a Content-Security-Policy header. Built and checked under a real Chromium (Playwright) across the
      home page, a listing, the booking box, the confirmation page and the operator dashboard at 1280 and 390
      widths before this shipped; see docs/security/2026-09-16-rendering.md for what that run found.

      connect-src names the production API. A build pointed at any other one (the dev server, the nightly
      rehearsal, a preview) has its own origin added here at build time by the cspApiOrigin plugin in
      vite.config.ts, because a blocked fetch reads to this app exactly like no API at all.
      'self' in frame-src is the operator dashboard's live preview, which frames the site's own listing page;
      without it the panel said "Loading your listing" forever (18 September 2026). hooks.stripe.com is where Stripe puts a card's 3D Secure challenge, so leaving it out of frame-src
      fails the payment rather than the frame.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' http: https:; media-src 'self' http: https:; connect-src 'self' https://outset-api.onrender.com https://photon.komoot.io https://api.stripe.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com;"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Outset</title>
    <link rel="canonical" href="https://onoutset.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#495940" />
    <link rel="preconnect" href="https://wsrv.nl" />
    <link rel="preload" href="/catalog-lite.json" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:opsz,wght@16..72,500;600;650&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

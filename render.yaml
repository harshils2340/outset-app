services:
  # The guest site, onoutset.com. Render builds it from every push to main and serves dist from its CDN; nothing
  # goes through GitHub Actions. Deep links (/operators, a shared listing) are rewritten to index.html so the
  # app routes them. Backend and docs changes do not trigger a site build.
  - type: web
    name: outset-web
    runtime: static
    # claim-index.json is removed from the published site on purpose. The API reads it from the repo checkout,
    # nothing in src/ fetches it, and serving it put 142,549 operators' hashed emails and masked hints
    # ("b...@example.com") on the CDN as a 6.6 MB download. The hash is an unsalted SHA-256 prefix, so with the
    # hint and the domain beside it the real address is cheap to recover. Also 6.6 MB off every deploy.
    buildCommand: npm ci && npx vite build --base=/ && cp dist/index.html dist/404.html && rm -f dist/claim-index.json
    staticPublishPath: dist
    buildFilter:
      ignoredPaths:
        - backend/**
        - docs/**
        - .github/**
    envVars:
      - key: VITE_API_URL
        value: https://outset-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # The site had only x-content-type-options. These are the rest of the cheap ones.
    # SAMEORIGIN rather than DENY because the operator dashboard previews the guest page in an iframe
    # (src/components/operator/OpPreview.tsx). geolocation stays on for the app's own "how far away" line
    # (src/lib/places.ts). includeSubDomains is deliberately left off HSTS: www and api have no DNS records
    # yet, and promising browsers that every future subdomain is HTTPS is a promise to keep on purpose.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: outset-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: CLAIM_SECRET
        sync: false
      # Neon Postgres, the store for profiles, bookings, payouts and the mail list. The pooled connection string.
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: harshils2340/outset-app
      # A Render account API key (Account Settings > API Keys). With it the API turns auto-deploy off on both
      # services from 4am to 10am Eastern, while the overnight sessions push, and deploys once when the window ends.
      - key: RENDER_API_KEY
        sync: false
      # Who may read GET /admin/metrics with an emailed-code session, comma separated. Unset means nobody, so
      # the internal dashboard is closed until this is set here (harshils2340@gmail.com). The route answers 404
      # to everyone else, and x-admin-key still works for curl. See docs/METRICS.md.
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_FROM
        value: Outset <onboarding@resend.dev>
      # Every booking request is emailed here with the shop's phone. Unclaimed shops are told by nobody else.
      - key: BOOKING_ALERT_EMAIL
        sync: false
      - key: MAIL_REPLY_TO
        value: hello@onoutset.com
      - key: MAIL_POSTAL
        sync: false
      - key: API_URL
        value: https://outset-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://onoutset.com,https://www.onoutset.com
      - key: SITE_URL
        value: https://onoutset.com/
      # POST /admin/payouts/run answers 404 without this, so the Monday payout cron would pay nobody and say
      # nothing. Same value as the outset-payouts job below.
      - key: ADMIN_KEY
        sync: false
      # Resend signs bounce and complaint events with this. Without it the webhook refuses every event, so a
      # dead address is never suppressed and a spam complaint is never recorded, and outreach keeps mailing
      # both until the sending domain is burned. The webhook is registered in Resend against
      # POST /webhooks/resend; this is the signing secret it handed back.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # OUTSET_TEST_CLAIM_EMAILS is deliberately NOT listed here. It is a testing-only bypass that lets the
      # addresses it names claim and release any listing without the website-email check, so it must never be
      # part of the production service definition. Unset is the safe default and the only correct value here.
      # See backend/AGENTS.md, "Test claim bypass", and backend/src/lib/testClaim.ts.

  # Long-running pipeline: crawls, cover screen, batch collection and the nightly catalog sync and push.
  # The build only provides Node and Chromium; the worker clones the repo onto its disk and runs every job from that clone.
  - type: worker
    name: outset-pipeline
    runtime: node
    rootDir: backend
    plan: starter
    # Chromium comes from the `playwright` devDependency. --with-deps needs apt (may be refused on the native runtime); the plain install still lands the browser.
    buildCommand: npm ci --include=dev && (npx playwright install --with-deps chromium || npx playwright install chromium)
    startCommand: npx tsx scripts/pipeline.mts
    disk:
      name: outset-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: OUTSET_DB_PATH
        value: /var/data/outset.db
      - key: PIPELINE_TZ
        value: America/Toronto
      - key: GITHUB_REPO
        value: harshils2340/outset-app
      - key: GITHUB_TOKEN
        sync: false
      - key: GIT_AUTHOR_NAME
        sync: false
      - key: GIT_AUTHOR_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OUTSET_EXTRACT_BUDGET_USD
        value: "8"
      - key: PAID_CAP_USD
        value: "20"
      - key: DB_SEED_URL
        sync: false
      # OUTSET_CHROME: leave unset; the Playwright install under ~/.cache/ms-playwright is found automatically.

  # Operators are paid every Monday. ADMIN_KEY is the same value as on outset-api. One transfer per booking code,
  # so a second run pays nobody twice. This used to be duplicated as a GitHub Actions workflow; GitHub disabled
  # Actions for the account on 16 September 2026 because the crawl workflows used runners to read third-party
  # sites, so every scheduled job now lives here and Actions carries only the end-to-end CI run.
  - type: cron
    name: outset-payouts
    runtime: node
    schedule: "0 13 * * 1"
    buildCommand: "true"
    startCommand: curl -fsS -m 300 -X POST -H "x-admin-key:$ADMIN_KEY" https://outset-api.onrender.com/admin/payouts/run
    envVars:
      - key: ADMIN_KEY
        sync: false

  # The free API service sleeps after fifteen idle minutes and takes half a minute to wake, which a guest tapping
  # Book would feel. A health ping every twelve minutes keeps it up. Same call the old keep-warm workflow made.
  - type: cron
    name: outset-keep-warm
    runtime: node
    schedule: "*/12 * * * *"
    buildCommand: "true"
    startCommand: curl -fsS -m 120 -o /dev/null -w "API answered in %{time_total}s\n" https://outset-api.onrender.com/health

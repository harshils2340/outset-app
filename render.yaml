services:
  - type: web
    name: outset-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: CLAIM_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: harshils2340/outset-app
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_FROM
        value: Outset <onboarding@resend.dev>
      - key: MAIL_REPLY_TO
        value: hello@onoutset.com
      - key: ALLOWED_ORIGINS
        value: https://onoutset.com,https://www.onoutset.com
      - key: SITE_URL
        value: https://onoutset.com/

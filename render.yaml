services:
  # The guest site, onoutset.com. Render builds it from every push to main and serves dist from its CDN; nothing
  # goes through GitHub Actions. The marketplace is only the real app paths (/activities, /operators, /admin,
  # /listing/*), rewritten to app.html. Any other path that is not a real file opens the home page. Backend and
  # docs changes do not trigger a site build.
  - type: web
    name: outset-web
    runtime: static
    # claim-index.json is removed from the published site on purpose. The API reads it from the repo checkout,
    # nothing in src/ fetches it, and serving it put 142,549 operators' hashed emails and masked hints
    # ("b...@example.com") on the CDN as a 6.6 MB download. The hash is an unsalted SHA-256 prefix, so with the
    # hint and the domain beside it the real address is cheap to recover. Also 6.6 MB off every deploy.
    # build-pages.mts writes the activity-and-city pages, the per-listing pages, the sitemaps and robots.txt into
    # dist. They are not committed: about 14,500 files that every sync would rewrite. A failure there fails the
    # build on purpose, because a deploy with no sitemap drops the whole site out of the index.
    # onoutset.com's home is the Otto page (public/otto.html, moved to index.html). The marketplace app is
    # copied to app.html and only served on the paths listed below. 404.html is the home page, so a missing
    # file opens that page and not the catalog. The copies run after build-pages, so its links land in the app
    # shell, and the home forwards any old root link in the app's shapes (#o=, #remove=, #claim=, #paid=) to
    # /activities or /operators. otto.html is moved, not copied, so the old /otto.html address falls through to
    # its redirect below instead of serving a second copy.
    buildCommand: npm ci && npx vite build --base=/ && npx tsx scripts/build-pages.mts && cp dist/index.html dist/app.html && mv dist/otto.html dist/index.html && cp dist/index.html dist/404.html && rm -f dist/claim-index.json
    staticPublishPath: dist
    buildFilter:
      ignoredPaths:
        - backend/**
        - docs/**
        - .github/**
    envVars:
      - key: VITE_API_URL
        value: https://outset-api.onrender.com
    routes:
      # Otto's page is the home now. Every outreach email before October 2026 linked /otto, so it and the old
      # file name redirect there rather than falling into the marketplace app.
      - type: redirect
        source: /otto
        destination: /
      - type: redirect
        source: /otto.html
        destination: /
      # Clean URLs for the standalone marketing and legal pages: without these the catch-all below sends /about
      # home. A real static file is still served directly; these just make the extensionless URL resolve.
      - type: rewrite
        source: /features
        destination: /features.html
      - type: rewrite
        source: /integrations
        destination: /integrations.html
      - type: rewrite
        source: /pricing
        destination: /pricing.html
      - type: rewrite
        source: /for/escape-rooms
        destination: /for/escape-rooms.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      # One page per shop, so a clinic hears their own call instead of the home page.
      # Files live in public/d/. The catch-all below would otherwise send this URL home.
      - type: rewrite
        source: /albionfinchmedical
        destination: /d/albionfinchmedical.html
      # /go was the concierge's own page and then a door to the site's agent overlay; it is retired. The
      # catch-all below would otherwise show the home under that URL as if it were a page of its own.
      - type: redirect
        source: /go
        destination: /activities
      - type: redirect
        source: /marketplace
        destination: /activities
      - type: rewrite
        source: /activities
        destination: /app.html
      - type: rewrite
        source: /activities/
        destination: /app.html
      - type: rewrite
        source: /operators
        destination: /app.html
      - type: rewrite
        source: /operators/
        destination: /app.html
      - type: rewrite
        source: /admin
        destination: /app.html
      - type: rewrite
        source: /admin/
        destination: /app.html
      - type: rewrite
        source: /listing/*
        destination: /app.html
      # Not a real page. Open the home page. The marketplace is only the paths above.
      - type: redirect
        source: /*
        destination: /
    # The site had only x-content-type-options. These are the rest of the cheap ones.
    # SAMEORIGIN rather than DENY because the operator dashboard previews the guest page in an iframe
    # (src/components/operator/OpPreview.tsx). geolocation stays on for the app's own "how far away" line
    # (src/lib/places.ts). includeSubDomains is deliberately left off HSTS: www and api have no DNS records
    # yet, and promising browsers that every future subdomain is HTTPS is a promise to keep on purpose.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: outset-api
    runtime: node
    rootDir: backend
    # fetch-seed pulls the catalog seed the API serves from; it was set on the live service in the dashboard and
    # this file had drifted from it. geo:build fetches this month's free DB-IP City Lite file and builds the
    # IP-to-metro table /where answers from (backend/scripts/build-ip-metros.mts). Neither fails the build:
    # without the geo file, /where answers without a city and the home falls back to the browser's time zone.
    # Render does not re-read this file for an existing service: a change here also has to be applied to the
    # service itself (dashboard, or PATCH /v1/services/<id> with the same buildCommand).
    buildCommand: npm ci --include=dev && npx tsx scripts/fetch-seed.mts && npm run geo:build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: CLAIM_SECRET
        sync: false
      # Neon Postgres, the store for profiles, bookings, payouts and the mail list. The pooled connection string.
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: harshils2340/outset-app
      # A Render account API key (Account Settings > API Keys). With it the API turns auto-deploy off on both
      # services from 4am to 10am Eastern, while the overnight sessions push, and deploys once when the window ends.
      - key: RENDER_API_KEY
        sync: false
      # Who may read GET /admin/metrics with an emailed-code session, comma separated. Unset means nobody, so
      # the internal dashboard is closed until this is set here (harshils2340@gmail.com). The route answers 404
      # to everyone else, and x-admin-key still works for curl. See docs/METRICS.md.
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Otto's grounded fallback (POST /otto/ask, backend/src/lib/cohere.ts). Unset means the assistant answers
      # from its rules alone. COHERE_DAILY_CAP and COHERE_RPM cap the calls; the defaults (30 a day, 15 a minute)
      # fit a trial key, which allows 1,000 calls a month.
      - key: COHERE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MAIL_FROM
        value: Harshil <hello@onoutset.com>
      # Every booking request is emailed here with the shop's phone. Unclaimed shops are told by nobody else.
      - key: BOOKING_ALERT_EMAIL
        sync: false
      - key: MAIL_REPLY_TO
        value: hello@onoutset.com
      - key: MAIL_POSTAL
        sync: false
      - key: API_URL
        value: https://outset-api.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://onoutset.com,https://www.onoutset.com,https://harshils2340.github.io
      - key: SITE_URL
        value: https://onoutset.com/
      # POST /admin/payouts/run answers 404 without this, so the Monday payout cron would pay nobody and say
      # nothing. Same value as the outset-payouts job below.
      - key: ADMIN_KEY
        sync: false
      # Resend signs bounce and complaint events with this. Without it the webhook refuses every event, so a
      # dead address is never suppressed and a spam complaint is never recorded, and outreach keeps mailing
      # both until the sending domain is burned. The webhook is registered in Resend against
      # POST /webhooks/resend; this is the signing secret it handed back.
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # OUTSET_TEST_CLAIM_EMAILS is deliberately NOT listed here. It is a testing-only bypass that lets the
      # addresses it names claim and release any listing without the website-email check, so it must never be
      # part of the production service definition. Unset is the safe default and the only correct value here.
      # See backend/AGENTS.md, "Test claim bypass", and backend/src/lib/testClaim.ts.

  # Long-running pipeline: crawls, cover screen, batch collection and the nightly catalog sync and push.
  # The build only provides Node and Chromium; the worker clones the repo onto its disk and runs every job from that clone.
  - type: worker
    name: outset-pipeline
    runtime: node
    rootDir: backend
    plan: starter
    # Chromium comes from the `playwright` devDependency. --with-deps needs apt (may be refused on the native runtime); the plain install still lands the browser.
    buildCommand: npm ci --include=dev && (npx playwright install --with-deps chromium || npx playwright install chromium)
    startCommand: npx tsx scripts/pipeline.mts
    disk:
      name: outset-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: OUTSET_DB_PATH
        value: /var/data/outset.db
      - key: PIPELINE_TZ
        value: America/Toronto
      - key: GITHUB_REPO
        value: harshils2340/outset-app
      - key: GITHUB_TOKEN
        sync: false
      - key: GIT_AUTHOR_NAME
        sync: false
      - key: GIT_AUTHOR_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OUTSET_EXTRACT_BUDGET_USD
        value: "8"
      # Every paid call this worker can make, added up: model extraction plus both discovery ledgers. Raised from
      # 20 to 60 on 18 September 2026 for the approved Google Maps pass, which is about $31 on its own and had no
      # room under the old cap. The pass is on demand, never scheduled, and carries its own 32,000-request budget.
      - key: PAID_CAP_USD
        value: "60"
      # Google Maps discovery (Serper, SerpApi or SearchApi.io; the key's shape picks the provider). Comma
      # separated. Paste the same value that is in backend/.env. Without it the `search` job refuses to run,
      # which is the safe default: no key, no spend.
      - key: SEARCHAPI_KEYS
        sync: false
      - key: DB_SEED_URL
        sync: false
      # The outreach job runs here, not on outset-api, because the draft queue is this worker's own SQLite disk.
      # Paste the same values already set on outset-api. Any one missing keeps sendOutreach's guards refusing to
      # send (backend/src/outreach/guards.ts), which is the point: no key here, no mail from here.
      - key: RESEND_API_KEY
        sync: false
      - key: CLAIM_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAIL_POSTAL
        sync: false
      - key: MAIL_FROM
        value: Harshil <hello@onoutset.com>
      - key: MAIL_REPLY_TO
        value: hello@onoutset.com
      - key: SITE_URL
        value: https://onoutset.com/
      # The nightly `spend` job posts what discovery and extraction have cost to POST /admin/spend on the API,
      # because those ledgers and the extract_spend table live on this worker's disk and the deployed API cannot
      # read them. Without either of these the job prints one line and exits 0; the metrics page then shows
      # "not reported yet" rather than a false zero. ADMIN_KEY is the same value as on outset-api and on
      # outset-payouts. See docs/METRICS.md.
      - key: ADMIN_KEY
        sync: false
      - key: API_URL
        value: https://outset-api.onrender.com
      # OUTSET_CHROME: leave unset; the Playwright install under ~/.cache/ms-playwright is found automatically.

  # Operators are paid every Monday. ADMIN_KEY is the same value as on outset-api. One transfer per booking code,
  # so a second run pays nobody twice. This used to be duplicated as a GitHub Actions workflow; GitHub disabled
  # Actions for the account on 16 September 2026 because the crawl workflows used runners to read third-party
  # sites, so every scheduled job now lives here and Actions carries only the end-to-end CI run.
  - type: cron
    name: outset-payouts
    runtime: node
    schedule: "0 13 * * 1"
    buildCommand: "true"
    startCommand: curl -fsS -m 300 -X POST -H "x-admin-key:$ADMIN_KEY" https://outset-api.onrender.com/admin/payouts/run
    envVars:
      - key: ADMIN_KEY
        sync: false

  # The free API service sleeps after fifteen idle minutes and takes half a minute to wake, which a guest tapping
  # Book would feel. A health ping every twelve minutes keeps it up. Same call the old keep-warm workflow made.
  # The Otto outreach send, from the cloud, every day at 9:30 Toronto time (13:30 UTC in summer, 8:30 in winter
  # once the clocks change; the hour matters less than the day). Nothing on a disk: candidates, history and the
  # warm-up state live in Postgres (backend/src/outreach/touches.ts), published from the laptop by
  # scripts/outreach-pool-sync.mts. Until 28 September 2026 this ran from the laptop's launchd and a laptop
  # that woke without Wi-Fi was a day with no mail. Every mailbox it sends from needs its app password here
  # (MAIL_SMTP_USER / _PASS, then _2 and up, see backend/.env.example); the guards in guards.ts refuse to send
  # until CLAIM_SECRET, MAIL_FROM, MAIL_POSTAL and the suppression list are all real here.
  - type: cron
    name: outset-otto
    runtime: node
    rootDir: backend
    schedule: "30 13 * * *"
    buildCommand: npm ci --include=dev
    startCommand: npx tsx scripts/otto-cloud.mts
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PIPELINE_TZ
        value: America/Toronto
      - key: OUTREACH_PER_MAILBOX
        value: "35"
      - key: MAIL_FROM
        value: Harshil <hello@onoutset.com>
      - key: MAIL_REPLY_TO
        value: hello@onoutset.com
      - key: SITE_URL
        value: https://onoutset.com/
      - key: API_URL
        value: https://outset-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CLAIM_SECRET
        sync: false
      - key: MAIL_POSTAL
        sync: false
      - key: MAIL_SMTP_USER
        sync: false
      - key: MAIL_SMTP_PASS
        sync: false
      - key: MAIL_SMTP_USER_2
        sync: false
      - key: MAIL_SMTP_PASS_2
        sync: false
      - key: MAIL_SMTP_USER_3
        sync: false
      - key: MAIL_SMTP_PASS_3
        sync: false
      - key: MAIL_SMTP_USER_5
        sync: false
      - key: MAIL_SMTP_PASS_5
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: harshils2340/outset-app

  - type: cron
    name: outset-keep-warm
    runtime: node
    schedule: "*/12 * * * *"
    buildCommand: "true"
    startCommand: curl -fsS -m 120 -o /dev/null -w "API answered in %{time_total}s\n" https://outset-api.onrender.com/health
